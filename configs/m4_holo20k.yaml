command: train
args:
  manifest: /path/to/train.csv
  output_dir: /path/to/output
  tensor_cache_dir: /path/to/tensor_cache
  residue_graph_cache_dir: /path/to/graph_cache
  s1_surface_cache_dir: /path/to/surface_cache
  s1_static_geometry_cache_dir: /path/to/static_cache
  require_tensor_cache: true
  require_residue_graph_cache: true
  require_s1_surface_cache: true
  require_s1_static_geometry_cache: true
  disable_s1_surface_on_the_fly: true
  fixed_train_manifest: /path/to/train.csv
  states: holo
  graph_views: seq_chain,k16,k32,exposure
  residue_graph_cache_ks: [16, 24, 32]
  s1_surface_cache_version: s1_surface_shrake_v1
  epochs: 20
  scheduler_total_epochs: 20
  batch_size: 2
  grad_accum_steps: 4
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.05
  min_learning_rate: 1.0e-6
  pos_weight_factor: 0.5
  dim: 128
  gvp_vector_dim: 16
  view_layers: 2
  router_mode: global
  use_augmented_features: true
  residue_feature_dim: 43
  s1_surface_points: 1024
  s1_surface_graph_k: 16
  surface_extra_graph_ks: 32
  surface_global_feedback_before_residue: true
  surface_global_feedback_rounds: 2
  s1_surface_layers: 2
  s1_surface_residue_topk: 16
  s1_residue_surface_topk: 32
  s1_projection_mode: per_residue_sigma
  s1_multiscale_sigmas: 4:2,8:4,14:7
  s1_surface_attention_prior_weight: 0.25
  s1_surface_attention_sigma_tangent: 8.0
  s1_surface_attention_sigma_normal: 4.0
  surface_encoder_mode: gvp
  surface_vector_bridge_mode: invariant
  surface_co_update_mode: bidir
  surface_co_update_layers: 3
  surface_fusion_mode: same_level
  global_feedback_rounds: 2
  core_cycles: 1
  surface_patch_mode: connected_pool_adj
  surface_patch_count: 32
  surface_patch_beta: 0.1
  surface_patch_attention_heads: 4
  residue_graph_flow_mode: k16_then_k32
  surface_graph_flow_mode: parallel
  base_aux_loss_weight: 0.2
  grad_clip_norm: 1.0
  pair_gaussian_mode: k_nearest
  pair_gaussian_topk: 16
  pair_gaussian_beta: 0.05
  pair_gaussian_sigma_tangent: 8.0
  pair_gaussian_sigma_normal: 4.0
  pair_gaussian_only: true
  pair_gaussian_fusion_mode: deep
  pair_gaussian_joint_mode: joint_only
  surface_soft_loss_weight: 0.05
  surface_soft_sigma_tangent: 6.0
  surface_soft_sigma_normal: 3.0
  surface_soft_cutoff: 24.0
  surface_soft_label_mode: global_max
  surface_soft_label_topk: 16
  surface_round_end_r2s_mode: skip
  surface_serial_stage_mode: none
  triplet_gaussian_mode: none
  final_residue_skip_mode: gated
  final_residue_skip_source: multiview
  final_residue_skip_beta: 0.1
  final_residue_skip_init_zero: true
  semantic_patch_mode: graph_motif_refine
  semantic_patch_beta: 0.03
  semantic_patch_amplitude_loss_weight: 0.03
  semantic_patch_set_loss_weight: 0.03
  semantic_patch_existence_loss_weight: 0.01
  semantic_patch_connectivity_loss_weight: 0.003
  semantic_patch_boundary_mix: 0.10
  semantic_patch_boundary_temperature: 0.7
  semantic_patch_boundary_start_epoch: 3
  semantic_patch_detach_backbone: true
  semantic_patch_radius_min: 2.0
  semantic_patch_radius_max: 16.0
  semantic_patch_active_topk: 4
  semantic_patch_graph_hops: 2
  semantic_patch_query_count: 8
  save_every_steps: 999999
  save_every_epoch: true
  log_every: 1
  amp: true
  seed: 42
