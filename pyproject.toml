[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsbind-paper"
version = "1.1.0"
description = "GSbind E11 model and final paper evidence"
requires-python = ">=3.10"
dependencies = ["torch>=2.1,<2.6", "lightning>=2.4,<3", "numpy>=1.24,<3", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "gemmi>=0.7", "pyarrow", "joblib", "tqdm", "matplotlib", "requests", "biopython", "beautifulsoup4", "xlrd"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gsbind = "gsbind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
