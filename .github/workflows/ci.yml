name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.2
      - run: pip install -e ".[train]" pytest
      - run: python -m compileall -q main.py inference.py src scripts tests
      - run: pytest
