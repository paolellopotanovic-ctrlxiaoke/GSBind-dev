name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.2
      - run: pip install -e . pytest
      - run: python scripts/verify_sources.py
      - run: python -m compileall -q main.py inference.py src utils scripts tests
      - run: pytest
