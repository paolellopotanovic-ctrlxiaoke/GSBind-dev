name: GSbind public engineering
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests -q
      - run: python tools/check_publication.py
      - run: python main.py --config configs/smoke.json evaluate
