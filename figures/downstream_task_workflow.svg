   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(71.671587 207.164944)">Input protein structure</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(49.862758 222.914944)">Same protein, different targets</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(50.590376 239.269514)">Contact / annotation / function</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(272.178528 206.552912)">Frozen per-residue features</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(268.361184 223.686272)">GSBind: hidden 128D / score</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(275.029075 240.186272)">Controls: structure / PeSTo</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(532.924534 103.603931)">A  AlloBench: site classification</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(531.059964 118.336744)">383 proteins; 216,556 positions</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(534.700511 134.086744)">Fit source 5-fold logistic heads</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(517.87262 150.853931)">Labels: annotated allosteric residues</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(557.177894 223.164251)">B  AM: frozen transfer</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(509.091175 237.897064)">127 proteins; 1,801 annotated positions</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(516.306644 253.647064)">Reuse AlloBench heads; no AM fitting</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(502.311292 269.397064)">Labels: supplied mutation-site annotations</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(548.13887 341.707384)">C  Src: functional ranking</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(511.533245 357.457384)">Full-length + kinase-domain constructs</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(521.635394 373.207384)">269 labeled positions per construct</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(515.571644 388.957384)">Fit Src-only purged 5-fold ridge heads</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(816.479255 112.673578)">Find annotated sites</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(828.00863 129.173578)">Pooled PR curve</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(824.40613 144.607953)">Trapezoidal AUPR</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(815.956755 227.651792)">Transfer site ranking</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(828.00863 245.217418)">Pooled PR curve</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(824.40613 260.651792)">Trapezoidal AUPR</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(789.322419 349.582384)">Predict experimental sensitivity</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(806.09945 365.209337)">mean |activity effect| at i</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243442" transform="translate(794.898903 381.082384)">Complete-OOF Spearman rho</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #cb584b" x="614.492308" y="304.41312" transform="rotate(-0 614.492308 304.41312)">Not AlloBench → Src transfer</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243442" x="504" y="32.685188" transform="rotate(-0 504 32.685188)">What do the three result panels evaluate?</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52606d" transform="translate(148.963359 447.765539)">A/B ask whether binding-trained features identify regulatory annotations. C asks whether those features predict experimentally derived functional sensitivity.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52606d" transform="translate(104.77125 458.568)">Source heads are test-selected (exploratory); AM has no target fitting or selection. Unannotated AM positions are not assigned negative labels. No causal mechanism is inferred.</text>
  </g>
 </g>
