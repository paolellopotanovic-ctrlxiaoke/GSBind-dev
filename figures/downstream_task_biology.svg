  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52606d" transform="translate(75.894609 408.237539)">Conceptual schematic only: no measured distances or inferred signaling paths. Contact, allosteric annotation and functional sensitivity are different labels; they may overlap.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52606d" transform="translate(225.938672 419.04)">Allosteric sites may bind small-molecule effectors; not every function-sensitive position is an allosteric site.</text>
